name: terraform-monorepo-action
description: Detects Terraform/OpenTofu modules in a monorepo and returns the ones affected by a change, dependency-aware and classified as root/child modules.
author: vivicta
branding:
  icon: layers
  color: purple

inputs:
  mode:
    description: Set to `all` to return every module or `changed` to return only modules affected by the change. Defaults to `changed`.
    required: false
    default: changed
  files:
    description: Glob patterns restricting which changed files are considered (passed to tj-actions/changed-files).
    required: false
  files_ignore:
    description: Glob patterns of changed files to ignore (passed to tj-actions/changed-files).
    required: false
  base_sha:
    description: Override the base SHA used for the diff (passed to tj-actions/changed-files).
    required: false
  sha:
    description: Override the head SHA used for the diff (passed to tj-actions/changed-files).
    required: false
  since_last_remote_commit:
    description: Diff against the last remote commit instead of the default base (passed to tj-actions/changed-files).
    required: false
    default: 'false'
  fetch_depth:
    description: Depth of additional history to fetch when required (passed to tj-actions/changed-files).
    required: false
    default: '25'
  include:
    description: Glob patterns of directories to consider during module discovery. Empty means the whole repository.
    required: false
  exclude:
    description: Glob patterns of directories to exclude from module discovery (on top of built-in defaults).
    required: false
  follow_dependencies:
    description: Mark modules that depend (via local `module` source references) on changed modules as changed too. Defaults to `true`.
    required: false
    default: 'true'
  environments:
    description: 'Per-environment file patterns, one `name=pattern[;pattern...]` per line (e.g. `prod=prod.tfvars;prod.backend.tfvars`). Patterns without `/` match file names anywhere; patterns with `/` are path globs. A changed file matching a pattern triggers only that environment; other changed files trigger all environments of their module.'
    required: false
  summary:
    description: Write a markdown report of the detected modules to the job summary. Defaults to `true`.
    required: false
    default: 'true'

outputs:
  root_modules:
    description: JSON array of affected root (deployable) module paths — feed this to your terraform/tofu matrix via fromJSON().
    value: ${{ steps.detect.outputs.root_modules }}
  root_modules_ordered:
    description: JSON array of arrays; root modules in topologically ordered layers with dependencies first. Modules within a layer can run in parallel.
    value: ${{ steps.detect.outputs.root_modules_ordered }}
  module_changes:
    description: 'JSON object with per-status module lists: {"added": [], "modified": [], "renamed": [], "deleted": []}.'
    value: ${{ steps.detect.outputs.module_changes }}
  dependency_graph:
    description: JSON object of every discovered module with class, engine, markers, dependencies and dependents.
    value: ${{ steps.detect.outputs.dependency_graph }}
  environments_matrix:
    description: 'JSON array of {module, environment} entries for `strategy.matrix.include`, fanned out per triggered environment.'
    value: ${{ steps.detect.outputs.environments_matrix }}
  any_changed:
    description: Whether any module is affected ('true'/'false').
    value: ${{ steps.detect.outputs.any_changed }}

runs:
  using: composite
  steps:
    - name: Detect changed files
      id: changed-files
      if: ${{ inputs.mode == 'changed' }}
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: ${{ inputs.files }}
        files_ignore: ${{ inputs.files_ignore }}
        base_sha: ${{ inputs.base_sha }}
        sha: ${{ inputs.sha }}
        since_last_remote_commit: ${{ inputs.since_last_remote_commit }}
        fetch_depth: ${{ inputs.fetch_depth }}
        json: 'true'
        escape_json: 'false'
        safe_output: 'false'

    - name: Detect Terraform modules
      id: detect
      uses: ./detect
      with:
        mode: ${{ inputs.mode }}
        include: ${{ inputs.include }}
        exclude: ${{ inputs.exclude }}
        follow_dependencies: ${{ inputs.follow_dependencies }}
        environments: ${{ inputs.environments }}
        summary: ${{ inputs.summary }}
        added_files: ${{ steps.changed-files.outputs.added_files }}
        copied_files: ${{ steps.changed-files.outputs.copied_files }}
        modified_files: ${{ steps.changed-files.outputs.modified_files }}
        renamed_files: ${{ steps.changed-files.outputs.renamed_files }}
        type_changed_files: ${{ steps.changed-files.outputs.type_changed_files }}
        deleted_files: ${{ steps.changed-files.outputs.deleted_files }}
