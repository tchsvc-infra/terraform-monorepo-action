exclude: ^dist/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
        name: Check for files with names that would conflict on a case-insensitive filesystem
      - id: check-merge-conflict
        name: Check for files that contain merge conflict strings
      - id: end-of-file-fixer
        name: Makes sure files end in a newline and only a newline.
        types: [text]
      - id: trailing-whitespace
        name: Trims trailing whitespace.
        types: [text]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ['-L', 'tf', '--skip=package-lock.json']

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --check
        language: system
        types_or: [ts, javascript, json, yaml, markdown]
      - id: eslint
        name: eslint
        entry: npx --no-install eslint
        language: system
        types_or: [ts, javascript]
        pass_filenames: false
